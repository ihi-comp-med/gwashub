name: row_check
title: Row check
description: File parses; mapped columns exist and look numeric. Rewrites the upload
  as a plain TSV.
command:
- python
- row_check.py
image: gwashub/base
default_on_fail: block
resources: []
params:
  - {key: min_numeric_fraction, label: Minimum numeric fraction, type: number, min: 0, max: 1, default: 0.9,
     help: Share of rows whose numeric columns must parse as numbers}
  - {key: min_rows, label: Minimum rows, type: integer, min: 1, default: 1000}
