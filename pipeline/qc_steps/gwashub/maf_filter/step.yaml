name: maf_filter
title: MAF filter
description: Drop variants below a minor-allele-frequency threshold.
command:
- python
- maf_filter.py
image: gwashub/base
default_on_fail: flag
resources: []
params:
  - {key: maf_threshold, label: Minimum MAF, type: number, min: 0, max: 0.5, default: 0.01, help: Variants with minor allele frequency below this are removed}
