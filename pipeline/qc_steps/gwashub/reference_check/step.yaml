name: reference_check
title: Reference check
description: Align alleles to the reference panel (effect allele = ALT); resolve palindromic
  SNPs; detect swapped alleles and wrong builds.
command:
- python
- reference_check.py
image: gwashub/base
default_on_fail: block
resources:
- ref_panel_grch38.tsv.gz
params:
  - {key: palindromic_max_maf, label: Palindromic SNPs resolvable below MAF, type: number, min: 0, max: 0.5, default: 0.4,
     help: A/T and C/G SNPs are oriented by allele frequency only when their MAF is below this; others are removed}
  - {key: warn_eaf_correlation, label: Warn below EAF correlation, type: number, min: 0, max: 1, default: 0.8,
     help: Correlation between the dataset's and the reference's allele frequencies}
