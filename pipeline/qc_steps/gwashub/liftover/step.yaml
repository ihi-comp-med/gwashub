name: liftover
title: Liftover
description: Lift GRCh37 positions to GRCh38 with a chain file; reverse-complement
  alleles on strand flips.
command:
- python
- liftover.py
image: gwashub/base
default_on_fail: flag
resources:
- hg19ToHg38.over.chain.gz
params:
  - {key: warn_unmapped_fraction, label: Warn above unmapped fraction, type: number, min: 0, max: 1, default: 0.01}
  - {key: fail_unmapped_fraction, label: Fail above unmapped fraction, type: number, min: 0, max: 1, default: 0.1}
