name: ldsc
title: LD score regression
description: "LD score regression with the authors' LDSC software: intercept, heritability and ratio."
narrative: >
  Runs the authors' LDSC software (bulik/ldsc, Python 2.7): munge_sumstats prepares the dataset (HapMap 3 SNPs, INFO and
  MAF limits), then LD score regression with the Pan-UK Biobank LD scores of the dataset's ancestry estimates the
  intercept, SNP heritability and ratio. An intercept near 1 means the inflation is polygenic signal; above the set
  threshold it suggests confounding or population stratification, and the step warns.
command: [python, ldsc.py]
image: gwashub/ldsc
default_on_fail: flag
resources: []
optional_resources: [w_hm3.snplist,
  UKBB.AFR.l2.ldscore.gz, UKBB.AFR.l2.M_5_50, UKBB.AMR.l2.ldscore.gz, UKBB.AMR.l2.M_5_50,
  UKBB.CSA.l2.ldscore.gz, UKBB.CSA.l2.M_5_50, UKBB.EAS.l2.ldscore.gz, UKBB.EAS.l2.M_5_50,
  UKBB.EUR.l2.ldscore.gz, UKBB.EUR.l2.M_5_50, UKBB.MID.l2.ldscore.gz, UKBB.MID.l2.M_5_50]
compute: {vcpus: 2, memory_gb: 16}
params:
  - {key: warn_intercept, label: Warn above intercept, type: number, min: 1, max: 2, default: 1.1,
     help: An intercept above this suggests confounding or population stratification}
  - {key: info_min, label: Minimum INFO (munge), type: number, min: 0, max: 1, default: 0.9, help: munge_sumstats.py --info-min}
  - {key: maf_min, label: Minimum MAF (munge), type: number, min: 0, max: 0.5, default: 0.01, help: munge_sumstats.py --maf-min}
  - {key: n_blocks, label: Jackknife blocks, type: integer, min: 2, max: 1000, default: 200, help: ldsc.py --n-blocks}
