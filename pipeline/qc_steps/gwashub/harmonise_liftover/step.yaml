name: harmonise_liftover
title: Harmonise and liftover
description: "Harmonises variants to the reference genome with gwas2vcf, lifts GRCh37 to GRCh38 and adds dbSNP rsIDs."
narrative: >
  Converts the dataset to VCF with gwas2vcf (the HERMES 3 edited copy), checking every variant against the reference
  genome of the uploaded build: the reference allele must match, alleles are switched (BETA and EAF flipped) where the
  effect allele is the reference, and indels are normalised. GRCh37 datasets are then lifted to GRCh38 with bcftools
  +liftover and the UCSC chain (strand flips handled), dbSNP 157 rsIDs are added, and variants lifted to another
  chromosome or off the primary contigs are removed. Writes GRCh38 with the effect allele = ALT, and counts for each
  stage; warns when fewer than the set share harmonise or lift. First it checks the declared build: up to 20,000 SNPs
  are looked up in both reference genomes, and if the other build matches clearly better the step warns and names it.
command: [python, harmonise_liftover.py]
image: gwashub/vcf
default_on_fail: block
resources:
  - human_g1k_v37.fasta
  - human_g1k_v37.fasta.fai
  - Homo_sapiens_assembly38_nochr.fasta
  - Homo_sapiens_assembly38_nochr.fasta.fai
  - hg19ToHg38.over.chain.gz
  - dbSNP157_b38_clean.vcf.gz
  - dbSNP157_b38_clean.vcf.gz.tbi
optional_resources:
  # Only for a bgzipped FASTA (the synthetic ones); the real FASTAs are plain text.
  - human_g1k_v37.fasta.gzi
  - Homo_sapiens_assembly38_nochr.fasta.gzi
compute: {vcpus: 4, memory_gb: 60}   # the HERMES 3 HPC pipeline's gwas2vcf rule (mem_mb 60000); fits an r7i.2xlarge
params:
  - {key: warn_harmonised_fraction, label: Warn below harmonised fraction, type: number, min: 0, max: 1, default: 0.95,
     help: Share of variants whose alleles match the reference genome of the uploaded build}
  - {key: warn_lifted_fraction, label: Warn below lifted fraction, type: number, min: 0, max: 1, default: 0.95,
     help: Share of harmonised GRCh37 variants lifted to GRCh38}
