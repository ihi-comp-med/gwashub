name: harmonise_liftover
title: Harmonise and liftover
description: >
  Harmonises every variant to the reference genome of the uploaded build with gwas2vcf (REF must match; alleles
  switched where needed; indels normalised), lifts GRCh37 to GRCh38 with bcftools +liftover, adds dbSNP 157 rsIDs and
  removes variants lifted to another chromosome. The output is GRCh38 with the effect allele = ALT. As the HERMES 3 DCM
  pipeline, using its edited gwas2vcf.
command: [python, harmonise_liftover.py]
image: gwashub/vcf
default_on_fail: block
resources:
  - human_g1k_v37.fasta
  - human_g1k_v37.fasta.fai
  - Homo_sapiens_assembly38_nochr.fasta
  - Homo_sapiens_assembly38_nochr.fasta.fai
  - hg19ToHg38.over.chain.gz
  - dbSNP157_b38_clean.vcf.gz
  - dbSNP157_b38_clean.vcf.gz.tbi
optional_resources:
  # Only for a bgzipped FASTA (the synthetic ones); the real FASTAs are plain text.
  - human_g1k_v37.fasta.gzi
  - Homo_sapiens_assembly38_nochr.fasta.gzi
compute: {vcpus: 4, memory_gb: 64}
params:
  - {key: warn_harmonised_fraction, label: Warn below harmonised fraction, type: number, min: 0, max: 1, default: 0.95,
     help: Share of variants whose alleles match the reference genome of the uploaded build}
  - {key: warn_lifted_fraction, label: Warn below lifted fraction, type: number, min: 0, max: 1, default: 0.95,
     help: Share of harmonised GRCh37 variants lifted to GRCh38}
