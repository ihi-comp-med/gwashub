name: value_ranges
title: Value ranges
description: Drop missing/out-of-range values and duplicate variants; detect −log10(P)
  files.
command:
- python
- value_ranges.py
image: gwashub/base
default_on_fail: block
resources: []
params:
  - {key: warn_drop_fraction, label: Warn above dropped fraction, type: number, min: 0, max: 1, default: 0.005,
     help: Share of rows removed for out-of-range values}
  - {key: fail_drop_fraction, label: Fail above dropped fraction, type: number, min: 0, max: 1, default: 0.2}
