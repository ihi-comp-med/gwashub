name: info_filter
title: Imputation INFO filter
description: Drop poorly imputed variants.
command:
- python
- info_filter.py
image: gwashub/base
default_on_fail: flag
resources: []
params:
  - {key: info_threshold, label: Minimum INFO score, type: number, min: 0, max: 1, default: 0.8,
     help: Variants with imputation INFO below this are removed (variants without INFO are kept)}
