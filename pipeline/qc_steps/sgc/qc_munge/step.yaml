name: qc_munge
title: SGC QC (MungeSumstats)
description: "The Skin Genetics Consortium's qc_munge.R: MungeSumstats with SGC's filters, lifted to GRCh38."
narrative: >
  Runs the Skin Genetics Consortium's own QC script, qc_munge.R, as SGC wrote it (copied from
  github.com/Katie-Watts/SGC with two minor fixes, listed in SOURCE.md: MungeSumstats' header map loaded with data(),
  and the liftover's chain file given rather than downloaded). It runs MungeSumstats: INFO at least 0.3, effect-allele frequency and MAF
  at least 0.005, bi-allelic variants only, alleles checked and flipped against the reference genome, rsIDs filled from
  dbSNP 155, and everything lifted to GRCh38. GWASHub code only writes the dataset as a cohort file for it beforehand,
  and afterwards reads its output back into the GWASHub format and lists the removed rows. Its output in SGC's own
  columns can be downloaded too.
command: [python, gwashub_qc_munge.py]
image: sgc/mungesumstats
default_on_fail: block
resources: []
compute: {vcpus: 4, memory_gb: 60}   # MungeSumstats holds the file and dbSNP lookups in memory; to be measured on a full-size file
params:
  - {key: pass_build, label: Use the declared build, type: boolean, default: true,
     help: "Gives qc_munge.R the build declared at upload (its --ref-genome option); off, MungeSumstats infers it from rsIDs, as SGC runs it by default"}
  - {key: threads, label: Threads, type: integer, min: 1, max: 16, default: 4,
     help: "qc_munge.R's --threads (MungeSumstats' nThread)"}
  - {key: warn_removed_fraction, label: Warn above removed fraction, type: number, min: 0, max: 1, default: 0.05}
